[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ec-systemcore"
dynamic = ["version"]
description = "Fail-safe ECSC v1 Unix-domain IPC client"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "ec-systemcore contributors" }]
dependencies = []

[tool.setuptools.dynamic]
version = { attr = "ec_systemcore.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ec_systemcore*"]
